[project]
name = "local-anonymizer"
version = "0.2.9"
description = "Локальный обезличиватель документов"
requires-python = ">=3.11,<3.12"
dependencies = [
  "python-docx>=1.2.0,<2",
  "openpyxl>=3.1,<4",
  "lxml>=5.3,<7",
  "pywebview>=5.4,<7; sys_platform == 'win32'",
  "pywebview>=5.4,<7; sys_platform == 'darwin'",
  "pywebview[gtk]>=5.4,<7; sys_platform == 'linux'",
  "pywin32>=311; sys_platform == 'win32'",
  "cryptography>=44,<51; sys_platform == 'linux'",
  "cryptography>=44,<51; sys_platform == 'darwin'",
  "keyring>=25,<26; sys_platform == 'linux'",
  "keyring>=25,<26; sys_platform == 'darwin'",
  "secretstorage>=3.3,<4; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pyinstaller>=6.10,<7"]

[project.scripts]
local-anonymizer = "local_anonymizer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_anonymizer"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pymupdf>=1.26,<2",
]
