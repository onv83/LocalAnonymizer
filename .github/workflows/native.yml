name: Native Linux and macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native.yml"
      - "LocalAnonymizer.spec"
      - "build.sh"
      - "verify-native.sh"
      - "launcher.py"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/native.yml"
      - "LocalAnonymizer.spec"
      - "build.sh"
      - "verify-native.sh"
      - "launcher.py"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  test-build-smoke:
    name: ${{ matrix.os }} native package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dbus-x11 gnome-keyring gobject-introspection \
            libgirepository1.0-dev libgirepository-2.0-dev \
            libcairo2-dev pkg-config gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            xclip xvfb

      - name: Install locked dependencies
        run: uv sync --extra dev --frozen

      - name: Run tests
        run: uv run pytest

      - name: Build native package
        run: ./build.sh

      - name: Verify macOS package
        if: runner.os == 'macOS'
        run: ./verify-native.sh

      - name: Verify Linux package with Secret Service and X11 clipboard
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            ./verify-native.sh
          '

      - name: Upload macOS application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LocalAnonymizer-macos-arm64
          path: dist/LocalAnonymizer.app
          if-no-files-found: error

      - name: Upload Linux application
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LocalAnonymizer-linux-x64
          path: dist/LocalAnonymizer
          if-no-files-found: error
